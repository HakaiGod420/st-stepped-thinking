<div id="stepthink_character_settings--{{short_name}}">
    <h3 class="alignContentCenter">{{character_name}} settings</h3>

    <div class="flex-container marginTopBot5">
        <label class="checkbox_label expander"
               for="stepthink_is_thinking_enabled--{{short_name}}"
               title="Enable Stepped Thinking for this character. If this checkbox is unchecked, the other settings will be ignored, and the thinking process won’t start">
            <input id="stepthink_is_thinking_enabled--{{short_name}}" type="checkbox"/>
            Enable thinking on each message
        </label>
    </div>

    <div class="flex-container marginTopBot5">
        <label class="checkbox_label expander"
               for="stepthink_is_mind_reader--{{short_name}}"
               title="This option allows this character to read the thoughts of all other characters">
            <input id="stepthink_is_mind_reader--{{short_name}}" type="checkbox"/>
            Can read others' thoughts
        </label>
    </div>

    <div class="flex-container marginTopBot5" title="Optional: make this character follow a specific direction while generating thoughts and plans">
        <label class="checkbox_label expander"
               for="stepthink_is_goal_enabled--{{short_name}}"
               title="Enable the optional character goal below">
            <input id="stepthink_is_goal_enabled--{{short_name}}" type="checkbox"/>
            Enable character goal / scenario
        </label>
    </div>

    <div class="flex-container marginTopBot5">
        <label for="stepthink_goal--{{short_name}}"
               title="This guides the character's generated thoughts and plans; it does not directly change the normal reply prompt">
            Goal / direction:
        </label>
        <textarea id="stepthink_goal--{{short_name}}" class="text_pole" rows="3"
                  placeholder="Example: Become friends with the user"></textarea>
    </div>

    <div class="flex-container justifySpaceBetween alignItemsCenter">
    <span title="If the list is not empty, these prompts will be used instead of the default ones for this character. Enabled names must be unique because they are JSON keys in one combined request.">
        Prompts for thinking (one JSON request):
    </span>
        <div id="stepthink_prompt_list_add--{{short_name}}"
             class="menu_button menu_button_icon fa-solid fa-plus"
             title="Add prompt"></div>
    </div>

    <div id="stepthink_prompt_list--{{short_name}}"></div>
</div>
